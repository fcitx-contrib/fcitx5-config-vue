name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Install dependencies
        run: |
          curl -LO --output-dir cache https://github.com/fcitx-contrib/fcitx5-js/releases/download/latest/fcitx5-js.tgz
          npm i -g pnpm
          pnpm i

      - name: Lint
        run: |
          pnpm run lint
          pnpm run check

      - name: Build
        run: |
          pnpm run build
          npm pack
          mv fcitx5-config-vue-*.tgz fcitx5-config-vue.tgz

      - name: Check out fcitx5-online test engine
        uses: actions/checkout@v7
        with:
          repository: fcitx/fcitx5-online
          path: test-engine/fcitx5-online

      - name: Install test engine
        run: |
          ln -s .. test-engine/fcitx5-config-vue
          ln -s ../../../cache/fcitx5-js.tgz test-engine/fcitx5-online/cache/fcitx5-js.tgz
          pnpm --dir test-engine/fcitx5-online install
          pnpm exec playwright install --with-deps

      - name: Build test engine
        run: pnpm --dir test-engine/fcitx5-online run build

      - name: Test
        env:
          FCITX5_ONLINE_DIR: test-engine/fcitx5-online
        run: pnpm run test

      - name: Release
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: true
          title: Nightly Build
          files: |
            fcitx5-config-vue.tgz
